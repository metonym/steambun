name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The shell is Swift and AppKit, and the tests drive the Mac app.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The test plan diffs a PR against its merge base with the base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `bun lint` ships in Bun 1.4.5; canary until then.
          bun-version: canary

      - name: Install
        run: |
          brew install zstd   # the shell links it for updates
          bun ci

      - name: Plan tests
        # A PR runs the tests its changes can reach (bivium.config.ts); a push
        # to master skips this step, so every suite below runs in full.
        id: plan
        if: github.event_name == 'pull_request'
        run: bunx --bun bivium plan origin/${{ github.base_ref }} --github

      - name: Check the test plan can read every test's inputs
        run: bunx --bun bivium check --max-unknown 0

      - name: Lint and format
        run: bun run lint

      - name: Unused files, exports and dependencies
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: The shell's generated Swift is up to date
        working-directory: examples/hello
        run: bunx steambun gen --check

      - name: Unit tests
        if: steps.plan.outputs.unit-tests != 'none'
        run: bun test ${{ steps.plan.outputs.unit-tests != 'all' && steps.plan.outputs.unit-tests || './tests' }}

      - name: Examples, in the Mac app and in a tab
        if: steps.plan.outputs.examples-tests != 'none'
        env:
          PLANNED: ${{ steps.plan.outputs.examples-tests }}
        run: |
          # The plan names test files; each example runs its own tests.
          if [ -z "$PLANNED" ] || [ "$PLANNED" = all ]; then
            dirs=$(ls -d examples/*/)
          else
            dirs=$(for f in $PLANNED; do echo "$f" | cut -d/ -f1-2; done | sort -u)
          fi
          for e in $dirs; do
            echo "::group::$e"
            (cd "$e" && bunx steambun test --both) || exit 1
            echo "::endgroup::"
          done

      - name: The packed package, installed in a new app
        if: steps.plan.outputs.package-tests != 'none'
        run: bun run test:package

      - name: Save failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-failures
          path: examples/*/build/test-failures/
          if-no-files-found: ignore
