name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: |
          brew install zstd   # the shell links it for updates
          bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Examples, in the Mac app and in a tab
        run: |
          for e in examples/*/; do
            (cd "$e" && bunx steambun test --both) || exit 1
          done

      - name: Package contents
        run: bun pm pack --dry-run

      - name: Save failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-failures
          path: examples/*/build/test-failures/
          if-no-files-found: ignore
