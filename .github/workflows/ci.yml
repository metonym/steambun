name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Lint and format
        run: bunx biome ci --error-on-warnings

      - name: Typecheck
        run: bun run typecheck

      - name: Knip
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build:package

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        example: [minimal, zero-config, bunfig, standalone, multi-page, fullstack]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Build example
        run: bun run --cwd examples/${{ matrix.example }} build

      - name: Smoke test dist/server.js
        if: matrix.example != 'standalone'
        run: |
          PORT=4173 bun examples/${{ matrix.example }}/dist/server.js &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4173/ > /dev/null; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then echo "server never came up"; kill "$pid" 2>/dev/null; exit 1; fi
          if [ "${{ matrix.example }}" = "fullstack" ]; then
            curl -sf http://localhost:4173/api/health | grep -q '"status":"ok"'
          fi
          kill "$pid"
